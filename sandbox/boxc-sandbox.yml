detail: >-
  BoxC does not run a separate sandbox host. Production and test resources share the same
  endpoint, https://api.boxc.com/v1. Test mode is opted into per shipment via an immutable
  boolean flag rather than a distinct key or base URL.
test_flag:
  field: test
  applies_to: shipment
  type: boolean
  default: false
  immutable: true
  effect: Generates test labels instead of live carrier labels for the shipment.
retention:
  note: Test shipments and their labels older than 30 days are automatically purged.
carrier_credentials_placeholder:
