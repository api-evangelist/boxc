        description: The [Entry Point](#tag/EntryPoints) id associated to the warehouse.
        type: string
        example: SZX002
        readOnly: true
      id:
        description: The unique warehouse ID
        type: string
        example: WH0SZ001
      language:
        description: The local language for the warehouse.
        type: string
        example: Chinese
        readOnly: true
      language_code:
        description: The local language code for the warehouse in ISO 639-1 format.
        type: string
        example: zh
        readOnly: true
      name:
        description: The warehouse name.
        type: string
        example: BoxC Shenzhen 1
        readOnly: true
    required:
      - id
  warehouse-storage:
    allOf:
      - type: object
        $ref: '#/definitions/Warehouse'
      - type: object
        properties:
          storage:
            description: Information about the storage costs for the warehouse.
            type: object
            properties:
              free_days:
                type: integer
                description: The number of days a product will be stored for free.
                example: 30
                readOnly: true
              large_cost:
                type: decimal
                description: The price per cubic meter for storing a large sized product.
                example: 30
                readOnly: true
              medium_cost:
                type: decimal
                description: The price for storing one unit of a medium sized product.
                example: 0.03
                readOnly: true
              small_cost:
                type: decimal
                description: The price for storing one unit of a small sized product.
                example: 0.01
                readOnly: true
  webhook:
    type: object
    properties:
      active:
        description: Displays the webhook status. Inactive webhooks will not have events delivered until they're updated by the owner.
        type: boolean
        example: true
        readOnly: true
      address:
        description: The URL for the webhook that will process the event.
        type: string
        maxLength: 128
        format: uri
        example: https://www.boxc.com/path/to/script
      created:
        description: The date and time the webhook was created.
        type: string
        example: '2024-07-18 14:10:01'
        format: datetime
        readOnly: true
      id:
        description: The unique ID of the webhook.
        type: integer
        example: 201921
        readOnly: true
      topic:
        description: The topic the user wishes to subscribe to. Immutable.
        type: string
        enum:
          - fulfillments_complete
          - fulfillments_update
          - manifests_complete
          - orders_status
          - shipments_label
          - shipments_status
        example: shipments_status
      updated:
        description: The date and time the webhook was last updated.
        type: string
        example: '2024-07-19 12:16:41'
        format: datetime
        readOnly: true
