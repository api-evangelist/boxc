  line-item-compliance:
    type: object
    description: Additional compliance elements for the line item.
    properties:
      cpsc:
        type: object
        description: Consumer Product Safety Commission (US) - either the product details or a `disclaim` must be provided.
        properties:
          product_id:
            type:
              - string
              - 'null'
            description: The product id that is used in the CPSC Registry.
            default: null
            pattern: ^[A-Za-z0-9./_-]+$
            maxLength: 19
          product_version:
            type:
              - string
              - 'null'
            description: The product id certificate version used in the CPSC Registry.
            default: null
            pattern: ^[A-Za-z0-9./_-]+$
            maxLength: 19
          certifier_id:
            type:
              - string
              - 'null'
            description: The certifier id for the product registry (LPCO number).
            pattern: ^[A-Za-z0-9./_-]+$
            maxLength: 23
            default: null
          disclaim:
            type:
              - object
              - 'null'
            description: A disclaim is required if you don't provide the `product_id`, `product_version`, and `certifier_id`.
            default: null
            properties:
              code:
                type: string
                description: Disclaim code
                enum:
                  - A
                  - B
              iuc:
                type: string
                description: IUC
                minLength: 7
                maxLength: 7
              iuc_description:
                type: string
                description: IUC description
                maxLength: 64
            required:
              - code
              - iuc
              - iuc_description
