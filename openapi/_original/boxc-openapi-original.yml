  /estimate:
    get:
      tags:
        - Estimate
      summary: GET /estimate
      description: Retrieves an estimate.
      operationId: getEstimate
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - JWT: []
      parameters:
        - in: query
          name: carrier
          description: The preffered last mile carrier the shipment should use for delivery.
          required: false
          default: null
          type: string
          example: DHLeC
        - in: query
          name: country
          description: The destination country in [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) format.
          required: true
          minLength: 2
          maxLength: 2
          format:
            - A-Z
          type: string
          example: US
        - in: query
          name: currency
          description: The ISO 4217 currency code for the **value** parameter and rates that are returned.
          required: false
          default: USD
          minLength: 3
          maxLength: 3
          format:
            - A-Z
          type: string
          example: USD
        - in: query
          name: dg_codes
          description: A string or array of [dangerous good codes](/#tag/DangerousGoods) contained in the shipment.
          required: false
          type: string|array
          example: '0965'
        - in: query
          name: entry_point
          description: The code for the drop off location. See [Entry Points](/#tag/EntryPoints) for a list of codes.
          required: true
          type: string
          example: LAXI01
          minLength: 6
          maxLength: 6
        - in: query
          name: exit_point
          description: The IATA port where the shipment should enter for last mile delivery. Providing this limits results to only those routes with the matching port.
          required: false
          default: null
          type: string
          example: JFK
          minLength: 3
          maxLength: 3
        - in: query
          name: height
          description: The height of the shipment in CM.
          required: false
          default: 1
          type: decimal
          example: 10.5
        - in: query
          name: insurance
          description: By default all shipments except for BoxC Post include insurance covering up to $30 of the total item value including shipping cost. Setting this to true will increase the insured value for an additional fee.
          required: false
          default: false
          type: boolean
          example: true
        - in: query
          name: irregular
          description: Indicates this shipment was packaged in irregular shaped polybag or soft packaging to assist in calculating the volumetric weight.
          required: false
          default: false
          type: boolean
          example: true
        - in: query
          name: is_return
          description: Indicates this shipment is a return.
          required: false
          default: false
          type: boolean
          example: true
        - in: query
          name: length
          description: The length of the shipment in CM.
          required: false
          default: 15
          type: integer
          example: 25
        - in: query
          name: packages
          type: array
          items:
            $ref: '#/definitions/PackageEstimate'
          maxItems: 12
          default: []
        - in: query
          name: postal_code
          description: The destination Postal Code or ZIP Code. Conditional.
          required: false
          type: string
          example: 10128
          maxLength: 10
        - in: query
          name: province
          description: The destination province / state code. Conditional.
          required: false
          type: string
          example: NY
          maxLength: 40
        - in: query
          name: signature_confirmation
          description: The shipment requires signature confirmation.
          required: false
          default: false
          type: boolean
          example: true
        - in: query
          name: terms
          description: The preferred incoterms.
          enum:
            - DAP
            - DDU
            - DDP
          required: false
          default: null
          type: string
          example: DDU
        - in: query
          name: value
          description: The total value of the items to calculate tax and insurance. Used with <i>currency</i>.
          required: false
          default: 0
          type: decimal
          example: 100
        - in: query
          name: weight
          description: The weight of the shipment in KG.
          required: true
          exclusiveMinimum: 0
          type: decimal
          example: 0.345
        - in: query
          name: width
          description: The width of the shipment in CM.
          required: false
          default: 10
          type: integer
          example: 2
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -H "Authorization: Bearer <YOUR TOKEN>" \
              -H "Accept: application/json" \
              https://api.boxc.com/v1/estimate\?entry_point=TEST01\&weight=0.345\&height=10.5\&width=2\&length=15\&province=CA\&postal_code=94041\&country=US\&signature_confirmation=false\&value=100\&currency=CAD\&irregular=0\&insurance=true\&carrier=DHLeC\&is_return=false&packages[0][length]=10&packages[0][height]=5&packages[0][width]=15&packages[0][weight]=5&packages[1][length]=20&packages[1][height]=10&packages[1][width]=12&packages[1][weight]=4
