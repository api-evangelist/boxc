                type: string
                description: The two letter address state abbreviation.
                example: LA
              zipCode:
                type: string
                description: Postal code.
                example: 70112
              zipCodeExtension:
                type: string
                description: 4-digit postal code extension.
                example: 2431
          deliveryPointCode:
            type: string
            description: 2 digit delivery point code
            example: 12
