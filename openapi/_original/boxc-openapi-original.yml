  /shipments:
    get:
      tags:
        - Shipments
      summary: GET /shipments
      description: Retrieves a paginated list of shipments.
      operationId: getShipments
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - JWT:
            - read_shipments
      parameters:
        - in: query
          name: created_min
          description: The inclusive date to begin the search.
          format: YYYY-MM-DD
          required: false
          type: string
          default: null
        - in: query
          name: created_max
          description: The inclusive date to end the search.
          format: YYYY-MM-DD
          required: false
          type: string
          default: null
        - in: query
          name: labeled
          description: Filter to return only shipments that have labels.
          enum:
            - 'yes'
            - 'no'
            - both
          required: false
          type: string
          default: both
        - in: query
          name: limit
          description: The number of results to return.
          required: false
          type: integer
          default: 50
          minimum: 50
          maximum: 100
        - in: query
          name: order
          description: The sort order of the results.
          enum:
            - asc
            - desc
          required: false
          type: string
          default: desc
        - in: query
          name: order_number
          description: Filter that searches for shipments by the order_number.
          required: false
          type: string
          default: null
        - in: query
          name: overpack_id
          description: Filter that searches for shipments by their overpack ID.
          required: false
          type: integer
          default: null
        - in: query
          name: packed
          description: Filter to return only shipments that are in an overpack.
          enum:
            - 'yes'
            - 'no'
            - both
          required: false
          type: string
          default: both
        - in: query
          name: page_token
          description: Used for selecting the page after the initial query.
          required: false
          default: null
          type: string
        - in: query
          name: processed
          description: Filter to return only shipments that are processed.
          enum:
            - 'yes'
            - 'no'
            - both
          required: false
          type: string
          default: both
        - in: query
          name: tracking_number
