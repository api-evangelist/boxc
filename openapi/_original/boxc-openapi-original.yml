  address:
    description: This is the user's personal or company address and may not be the same as the consignor.
    type: object
    properties:
      company_name:
        description: The company name.
        type: string
        maxLength: 40
        example: Terracotta Warriors Ltd, Co
      street1:
        description: The company's street address.
        type: string
        maxLength: 50
        example: 4 Jing Shan Qian Jie
      street2:
        description: Additional space for the company's street address.
        type:
          - string
          - 'null'
        default: null
        maxLength: 50
        example: Dongcheng
      city:
        description: The company's city.
        type: string
        maxLength: 40
        example: Beijing
      province:
        description: The company's province. Required for some countries.
        type:
          - string
          - 'null'
        default: null
        maxLength: 40
        example: Hebei
      postal_code:
        description: The company's postal code. Required for some countries.
        type:
          - string
          - 'null'
        maxLength: 10
        example: '100009'
        default: null
      country:
        description: The company's country in [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) format.
        type: string
        pattern: /^[A-Z]{2}$/
        example: CN
    required:
      - company_name
      - street1
      - city
      - country
  bad-request:
    type: object
    summary: Bad Request
    description: Validation error with the request
    properties:
      code:
        description: Error code. Refer to the list of [Errors](/#tag/Errors).
        type: integer
      message:
        description: Error message explaining the code.
        type: string
      status:
        type: string
        enum:
          - error
        example: error
      errors:
        description: Lists validation errors with the schema or the resource being operated on.
        type: array
        minItems: 1
        maxItems: 5
        items:
          type: string
  calculate-duty:
    type: object
    title: Calculate Duty
    properties:
      currency:
        description: The ISO 4217 currency code. The result `tax` and `duty` values will be in this currency. The `insurance` and `shipping` values provided in the request must also be in this currency.
        type: string
        pattern: ^[A-Z]{3}$
        example: USD
      destination:
        type: object
        description: Details about the origin of the shipment.
        properties:
          city:
            type:
              - string
              - 'null'
            default: null
            maxLength: 40
            example: New York
          province:
            type:
              - string
              - 'null'
            default: null
            maxLength: 40
            example: NY
          postal_code:
            type:
              - string
              - 'null'
            maxLength: 40
            example: null
            default: null
          country:
            type: string
            pattern: ^[A-Z]{2}$
            example: US
        required:
          - country
      insurance:
        description: Amount paid for insuring the shipment.
        type: number
        minimum: 0
        default: 0
        example: 0
      origin:
        type: object
        description: Details about the destination of the shipment.
        properties:
          city:
            type:
              - string
              - 'null'
            default: null
            maxLength: 40
            example: null
          province:
            type:
              - string
              - 'null'
            default: null
            maxLength: 40
            example: null
          postal_code:
            type:
              - string
              - 'null'
            maxLength: 40
            example: null
            default: null
          country:
            type: string
            pattern: ^[A-Z]{2}$
            example: CN
        required:
          - country
      products:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: object
          properties:
            coo:
              description: The product's country of origin.
              type: string
              pattern: ^[A-Z]{2}$
              example: CN
            currency:
              description: The currency for the product value.
              type: string
              pattern: ^[A-Z]{3}$
              example: CNY
            description:
              description: A short description of the product.
              type: string
              minLength: 3
              maxLength: 64
              example: Cotton T-Shirt
            duty:
              description: The calculated duty for the product.
              type: number
              readOnly: true
              minimum: 0
              default: 0
              example: 23.52
            duty_rate:
              description: The calculated duty rate for the product.
              type: number
              readOnly: true
              minimum: 0
              default: 0
              example: 0.175
            hs_code:
              description: The HS Code for the product.
              type: string
              minLength: 6
              pattern: ^[0-9]{6,}$
              example: 6109100040
            quantity:
              description: The number of units of the product.
              type: integer
              minimum: 0
              example: 10
            tax:
              description: The calculated tax for the product.
              type: number
              readOnly: true
              minimum: 0
              default: 0
              example: 0
            tax_rate:
              description: The calculated tax rate for the product.
              type: number
              readOnly: true
              minimum: 0
              default: 0
              example: 0
            value:
              description: The per unit value of the product.
              type: number
              exclusiveMin: 0
              example: 10
          required:
            - coo
            - currency
            - description
            - hs_code
            - quantity
            - value
      shipping:
        description: Amount paid in shipping costs for the shipment.
        type: number
        minimum: 0
        default: 0
        example: 0
      total:
        description: null
        type: object
        readOnly: true
        properties:
          duty:
            description: The total duty for all products.
            type: number
            minimum: 0
            default: 0
            example: 23.52
          tax:
            description: The total tax for all products.
            type: number
            minimum: 0
            default: 0
            example: 0
    required:
      - currency
      - origin
      - destination
      - products
