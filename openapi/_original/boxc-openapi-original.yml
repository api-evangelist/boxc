  - name: CalculateDuty
    x-displayName: Calculate Duty
    description: Calculate the landed cost of a shipment. This is a quick way to calculate the duties and taxes owed for a shipment without having to create one.
  - name: Classify
    x-displayName: Classify
    description: The Classify resource permits a user to retrieve the <em>most likely</em> HS code and description for one or more products. Each successful request costs $0.05 (USD) regardless of the number of products.
  - name: Credentials
    x-displayName: Credentials
    description: |-
      The Credentials resource allows users to store their own carrier account secrets securely. This gives users the ability to reuse their credentials without providing actual secret values in every single shipment request. There can be multiple secret values stored in a single credential resource. Supported carriers and parameters can be found in the [Carrier Credentials](/#tag/CarrierCredentials) section.

      **Note:** All secret params that are stored by BoxC are encrypted at the storage layer using the Advanced Encryption Standard (AES) algorithm — AES-256.

      **Important:** Once a credential resource is created, it is not possible to see the secret values for security reasons.

      **Important:** If the secret values have to be updated for any reason, we recommend updating your existing Credential resource instead of creating a new one. Doing so will ensure that secret values are always up to date for previously created labels with the same Credential resource and event tracking is not affected adversely.
  - name: CustomsProducts
    x-displayName: Customs\Products
    description: |
      Not to be confused with Fulfillment [Products](/#tag/Products), Customs Products are for clearing shipments containing regulated items like Food and Cosmetics (PGA). Customs Products contain information about the item including the manufacturer, seller, importer, etc. Shipments that are determined to be PGA must provide the `product_id` in the line item. Manifesting PGA shipments will notify the relevant agencies.

      Several properties are conditional and offer different options based on the `coi` and `type` of product.

      **Important:** This resource and its operations are in Beta and subject to change without notice.
  - name: DangerousGoods
    x-displayName: Dangerous Goods
    description: |
      Below is a list of permitted dangerous goods and their respective codes. The "DG Code" is equivalent to a product or shipment's `dg_code`. Shipments and orders that contain dangerous goods have less services to choose from.
      | DG Code | Description |
      |---------|-------------|
      | 0965 | Lithium-ion Batteries Loose |
      | 0966 | Lithium-ion Batteries Packed with Equipment |
      | 0967 | Lithium-ion Batteries Contained in Equipment |
      | 0968 | Lithium metal Batteries Loose |
      | 0969 | Lithium metal Batteries Packed with Equipment |
      | 0970 | Lithium metal Batteries Contained in Equipment |
      | ORMD1 | ORM-D Dry Cell Batteries |
      | ORMD2 | ORM-D Liquid (Limited Quantity) |
      | ORMD3 | ORM-D Powder (Limited Quantity) |
      | SDEC1 | Dry Cell Batteries Contained in Equipment |
      | SDEC2 | Magnets Contained in Equipment |
      | SDEC3 | Beauty Products Containing Powder or Liquid |
      | SDEC4 |  |
  - name: EntryPoints
    x-displayName: Entry Points
    description: |
      An entry point is the drop off location / origin for your shipments which affects your rates and the routes available. The `entry_point.id` is required when creating a shipment. You must query this endpoint to get an active list of entry points as some of added, changed, or removed.
