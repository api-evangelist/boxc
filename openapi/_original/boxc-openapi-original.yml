  - name: Estimate
    x-displayName: Estimate
    description: The Estimate resource allows a user to retrieve the estimated cost of shipping a package based on weight, dimensions, entry point, destination, and other parameters. No services will be returned if a route can't be matched against the provided parameters.
  - name: Inbound
    x-displayName: Inbound
    description: |
      The Inbound resource is part of the fulfillment component and allows customers to restock their products at warehouses operated by BoxC. An inbound shipment's products can't be modified after creation, but the warehouse, carrier, tracking number, and notes can be modified.

      ### Inbound Status
      The following table lists all possible states of an inbound shipment indicated by its `status` property. Only the system or warehouse can modify a shipment's status.

      | Status | Description |
      |--------|-------------|
      | Pending | The inbound shipment was created and may be en route to the warehouse. Default state. |
      | Received | The inbound shipment arrived at the warehouse. It can no longer be updated or deleted. |
      | Processed | The inbound shipment was processed and inventoried by the warehouse. |
  - name: Introduction
    x-displayName: Introduction
    description: |
      BoxC Logistics, Inc. provides a RESTful API to integrate seamlessly with other applications. All requests use the *application/json* content type unless specified and go over HTTPS. It's highly recommended that clients send an `Accept` header with their requests indicating the content type they're expecting to receive.

      ### Endpoint
      The API endpoint for both production and test resources is `https://api.boxc.com/v1`. The URI includes the major version of the API that you wish to use. In this case, it's `v1` for Version 1.x.

      ### Responses
      All responses from the server are in *application/json* format unless the requested resource supports other content types such as *application/pdf*. If there is an error the server will return an error code with a corresponding message describing the error. There is a [table of errors](/#tag/Errors) that explains what each error means in more detail. If you encounter an error take action immediately rather than resending the same request. If you receive a <em>500 Internal Server Error</em> it means something went wrong on BoxC's end and we should be contacted.

      An output resulting from an error includes four properties: status, code, message, and errors.
      ```json
      {
          "status": "error",
          "code": 1200,
          "message": "Label could not be created",
          "errors": {
            "shipments/to/postal_code": "Invalid value"
          }
      }
      ```

      ### Language Localization
      By default error responses are in English (`en`). Clients may request error messages in a different language by providing the `Accept-Language` header and an option from the [table of languages](/#tag/Languages). Often times raw error messages are returned directly from third party carrier APIs which may be in a different language than requested.

      ### Routines
      In order to reduce unnecessary clutter the system will routinely purge unused data. Below is a list of objects that should be considered ephemeral and not relied upon.

      - Test shipments and their labels that are older than 30 days.
      - Shipments with no labels that are older than 30 days.
      - Cartons with no shipments that are older than 30 days.
      - Orders not fulfilled and older than 1 year are deleted.
      - Inbound shipments 3 years and older are deleted.
      - Fulfilled orders are moved to an Archived state after 90 days.

      ### Timezone
      All datetimes in the responses are in UTC unless specified otherwise. Tracking events are displayed in the scan location's local timezone.

      ### Addresses
      There are several addresses involved with the shipping process that are described below to help the user differentiate between them. It's important to understand all of them because any mistakes may cause shipments to be delayed or never reach the recipient.
      #### Consignor (Seller) Address
      The company address is required before creating shipments (see [Users](/#tag/Users)). This is the same thing as the `consignor`, and it will be used by default if the user does not provide the `consignor` property for an individual shipment. If a user is shipping packages for multiple people but does not want their own company address listed as the `consignor` for Customs purposes they should use the consignor property to identify the sender.
      #### To (Shipping) Address
      The `to` address is the shipping address; it should be the final location of the shipment. In most cases it's the same as the consignee address. An error is returned when the address can't be validated and/or verified.
      #### From (Return) Address
      The `from` address is the return address the sender wishes to have their shipment returned to in case there is a problem with the delivery. This is not the same thing as the `consignor` but it can be the same address if needed. Shipments will use an address provided by BoxC if one isn't given. Return and shipping address countries must match.
      #### Consignee (Buyer) Address
      The `consignee` is the buyer of the goods. In most cases this is the same as the shipping address so the shipment will use that as the consignee address by default if one isn't provided. The consignee and shipping address country codes must be the same.
  - name: Invoices
    x-displayName: Invoices
    description: Invoices and statements are generated weekly and include a summary of all transactions between the invoice's `start_date` and `end_date`. Users can export an itemized list of all transactions for a billing period in their account.
  - name: Labels
    x-displayName: Labels
    description: The Labels resource allows a user to create, cancel, retrieve, and track labels for shipments. A label can't be created if there is already an uncancelled or processed label for the shipment. Labels that have been processed can't be cancelled. The user is responsible for paying the shipping costs if a label is cancelled but still processed at a facility. Test labels are routinely purged from the system.
  - name: Languages
    x-displayName: Languages
    description: |
      Below is a table of accepted languages. Provide the code from the table below in the `Accept-Language` header.
      | Language | Code |
      |----------|------|
      | English | en |
  - name: Manifests
    x-displayName: Manifests
    description: |-
      The Manifests resource is used for generating the paperwork required for dropping off Overpacks at a [collection center](/#tag/EntryPoints) or carrier facility at the end of the day. It also transmits the shipment data to the carrier(s) electronically. In order to create a manifest you must provide a list of the Overpacks that will be dropped off together. A manifest consists of all Shipments that are linked to each Overpack.

      **Note:** All overpacks in a manifest must have the same ```entry_point```, can't be empty, or missing weight and dimensions.

      Some manifests may have separate forms or no forms at all for the different carriers depending on the routes utilized by the affected shipments. Shipments should be sorted into Overpacks based on the carrier and other details prior to manifesting. Multiple copies of a form may exist for the driver and facility.

      **Note:** It can take up to several minutes before forms are available for download after manifesting because the required background tasks run asynchronously.

      **Important:** Once a manifest is created the associated overpacks and shipments can't be modified.
  - name: Orders
    x-displayName: Orders
    description: |
      The Orders resource allows you to create, read, update, and delete orders that are meant to be fulfilled by BoxC. If you wish to manually create an order for a third party shop you must provide the `shop.id` and `shop.order_id`. Neither property can be updated. The system will push tracking information to the shop when the order is fulfilled if both properties are set. Clients can force which warehouse is used for order fulfillment by setting the `warehouse.id` property.
      ### Order Status

      The following table lists all possible states of an order indicated by its `status` property. Updating an order that is 'Ready' will reset its status to 'Processing' and restore product quantities until it's processed by the system again.

      | Status | Description |
      |--------|-------------|
      | Backordered | There is insufficient quantity for one or more line items. The system will change the status once more inventory is added. |
      | Exception | There is a problem with the order such as missing or invalid information. The user must correct the problem before the order can be processed by the system. |
      | Holding | The order is being delayed from processing by the user. |
      | Processing | The order is waiting for the system to process it. Default state. |
      | Ready | The order is assigned to a warehouse for packing and quantities were deducted. |
      | Packing | One or more line items are being packed. <em>It can't be edited in this state</em>. |
      | Partial | The order was partially fulfilled. The remaining line items will be fulfilled when more inventory arrives. |
      | Fulfilled | The order was completely fulfilled. |
      | Archived | The system archives orders that were fulfilled at least 90 days in the past. |

      ### Pruning Orders

      The system routinely prunes or closes out orders in the system more than **365 days** ago. The start time is based on the `placed_at` and not the `created` datetime. What happens to the order depends on its current state at the time of pruning.

      - Unfulfilled (not Packing, Partial, Fulfilled) orders are deleted.
      - Partially fulfilled orders (Holding, Packing, Partial) are bumped to Fulfilled.
      - Orders in Packing have their unfulfilled line items and fulfillment objects deleted, and are bumped to Fulfilled.
  - name: Overpacks
    x-displayName: Overpacks
    description: |-
      The Overpacks resource allows a user to combine many Shipments into one object for faster clearance with BoxC and Customs. An overpack can be a carton, container, pallet, or bag. Regardless, it must contain an overpack label on the outside. Empty overpacks are routinely purged from the system.

      When creating an overpack it's recommended to provide one or more shipment ID, label ID, or tracking numbers in the request. The overpack will inherit the first shipment's (`n`) attributes like the `entry_point`, `service`, `terms`, etc. All shipments require identical attributes to be a part of the same overpack. Errors will be returned if the `n + 1` shipments do not match the first one. An error message will be present in the `shipments` array for each shipment that fails while creating or updating overpacks. Shipments that pass validation will still be added in the same request.

      The system will calculate the routing and other applicable carrier logic to determine the physical appearance of the label. Some carriers require custom messaging on the labels while others require a completely different label altogether. The system handles this logic on your behalf.

      **Note:** Shipments without labels and cancelled shipments can't be added to overpacks.

      The overpack(s) must be dropped off at the BoxC collection center indicated by the `entry_point`. Some entry points do not require overpacking and the system will prevent you from creating one. Deleting an overpack unassigns all shipments from it.

      **Note:** A client won't be able to print an overpack label until at least one shipment is assigned to it.
  - name: Paginate
    x-displayName: Paginate
    description: |
      When "searching" entities like Shipments and Orders there might be thousands of results. In order to reduce response time results are limited or "paged". Each response from the server will include the `next_page` property at the root level to assist in navigating to the next page of results. If no page exists after the current page then this property will be `null`. After making the initial query to an endpoint subsequent queries need only specify the `page_token` parameter in the request like below:

      ```text
      https://api.boxc.com/v1/shipments?page_token=ZGF0ZV9zdGFydD0yMDIzLTA0LTI5JmRhdGVfZW5kPTIwMjMtMDctMjgmbGltaXQ9NTAmb3JkZXI9ZGVzYyZsYWJlbGVkPSZwYWNrZWQ9JnBhZ2U9MSZwcm9jZXNzZWQ9Jmxhc3RfaWQ9ODIyMTE3OA==
      ```

      This tells the API which page to load. You no longer need to pass every query parameter after the initial search since it's tokenized. Your application can temporarily cache the page tokens for navigating backwards or forwards as needed."
  - name: Products
    x-displayName: Products
    description: |-
      The Products resource allows users to add their products to the BoxC system. A product can have one or more Stock Keeping Units (SKUs). This gives users the ability to link their different shops' SKUs to the same product. There can only be one active SKU per shop per product. Orders won't be fulfilled until the warehouse accepts and processes your products. This includes measuring the weight and dimensions, and updating the quantity.

      **Note:** Products and SKUs linked to orders can't be deleted. Existing SKUs can't be assigned to a different shop.
  - name: RateLimit
    x-displayName: Rate Limits
    description: |
      This API utilizes rate limiting for requests. It uses the leaky bucket algorithm to calculate the amount of requests that are granted every second up to a maximum number of requests. All rate limits are currently calculated against a user's ID across all applications. By default users are limited to a maximum of 30 requests with 2 new requests added to the bucket every second. There is no limit on the aggregate number of requests that can be made. The API returns a JSON response with error code 1015 while the limit is temporarily exceeded.

      The response includes two header lines to assist developers in staying within their limits:

      ```text
      X-Rate-Limit: m
      X-Rate-Requests: p
      ```


      Where `m` is the maximum requests or bucket size and `p` is the number of current requests. The number of remaining requests can be calculated as `m - p`.
  - name: Reshipments
    x-displayName: Reshipments
    description: |-
      The Reshipments resource allows you to reship one or more returned packages at a time from a BoxC warehouse. When a reshipment is created the `status` of all included returns will change to "Reshipping". Only returns with the following status can be reshipped: Processed, Verifying, and Verified. If reshipping more than one return at a time then you must wait for a facility operator to provide an `estimated_reship_fee`. If reshipping one return then the estimate will be instantaneous. In both cases you must approve the estimate before the reshipment is sent and your account is charged.

      **Note:** All returns in a bulk reshipment (> 1 return) must reside in the same warehouse.
      ### Status
      When a reshipment is created its status is set to "Pending" by default. It will remain that way until the `estimated_reship_fee` is populated by the system or facility operator. Afterwards, you have the option to approve or decline the amount by [updating](/#tag/Reshipments/operation/updateReshipment) the status accordingly. If "Declined", it will not be reshipped. If "Approved" it will be reshipped, tracking information will be made available, and a final reship_fee will be provided. Reshipments with the status "Approved" cannot be deleted.

      **Important:** Reshipments that are "Pending" or "Declined" longer than 15 days will be deleted by the system.

      **Note:** The final reshipping fee may differ from the estimated reshipping fee.
  - name: Returns
    x-displayName: Returns
    description: |-
      The Returns resource allows a user to retrieve a list of returned shipments processed at a BoxC warehouse. Users may verify, [reship](/#tag/Reshipments), or discard their returns. Discarding a return is irreversible.
      ### Verify
      Users have the option to verify a return before reshipping it. The facility operator will take additional pictures of the contents inside the return and add messages if necessary. To verify a return the user should <strong>PUT</strong> a `status` of "Verify". This will change the status of the return to "Verifying" which cannot be reversed. Only returns in the "Processed" state can be verified.
  - name: ReturnsProcess
    x-displayName: Returns Process
    description: |
      Diagram of the BoxC returns process.


      <img src="/i/rbb-flow.png?v=1">
  - name: Shipments
    x-displayName: Shipments
    description: |
      The Shipments resource allows a user to create, update, retrieve, and delete shipments. Only test shipments and shipments without labels can be deleted. Shipments with uncancelled or processed labels cannot be updated. All shipments require address verification on the shipping address. Cancelling a label will refund the cost. Test shipments and shipments without labels are routinely purged from the system.

      There are some weight and volumetric constraints for shipments that is dependant on the route. For example, if a Shipment's length + girth is greater than a certain size then the user is charged an additional fee per KG. The length is the measurement of the longest dimension, and girth is the distance around the thickest part (perpendicular to the length). If the Shipment's weight or volume exceeds the limit for a route an error will be returned.

      **Note:** Set the `overpack_id` to null when unassigning it from an overpack. You won't be allowed to update a labelled shipment beyond that.
  - name: Shops
    x-displayName: Shops
    description: The Shops resource allows a user to manage their fulfillment shop. A shop with orders or SKUs cannot be deleted. Clients should use a third party platform for integrating their ecommerce marketplaces with the BoxC API.
  - name: Track
    x-displayName: Track
    description: |
      The Track resource allows clients to retrieve tracking events for shipments by their tracking number. You may only track one shipment per request. This endpoint is rate limited.

      Some shipments may have <code>images</code> attached to them during transit such as processing scans and proof of delivery. To reveal these images in the response the client must either:

        A. Be the owner of the shipment;<br>
        B. Provide the shipping email address in the query;<br>
        C. Provide the postal code in the query if it's not revealed in the event history.
