      You may also authenticate with client credentials to receive an Access Token for the client owner's account by using the **client_credentials** grant type. This is useful for integrations that only need access to their own resources. The scope is inherited from the client settings.

      This endpoint uses Basic Authorization. The username is your Client ID and the password is your Client Secret.

      Example request:
      ```text
      POST /auth/v1/token HTTP/1.1
      Host: accounts.boxc.com
      Authorization: Basic Y2xpZW50X2lkOmNsaWVudF9zZWNyZXQ=
      Content-Type: application/x-www-form-urlencoded

      grant_type=client_credentials
      ```

      Response:
      ```json
      {
        "token_type": "Bearer",
        "access_token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6ImFkODQ3YjJkZTNmMTY1NjFlMDg3MDJhNjY2Mjc1MWMzOGVlODc0ZjcifQ.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjkwMDEiLCJpYXQiOjE2NjQ5MTI2NTcsImV4cCI6MTk4MDI3MjY1NywiYXVkIjoiaHR0cDovL2xvY2FsaG9zdDoxMDAwMCIsInN1YiI6IjEiLCJjbGllbnRfaWQiOiIxMDAwMDAwMDAwMTY2NDM0NTY5MiIsInNjb3BlIjoib3BlbmlkIHByb2ZpbGUgZW1haWwifQ.QyiHKRLI8J8Kmb2lR4m53BaiOJrpm1JaRUrYCnatuJbamXQKsURwyUbCD1zSYIKCLVmafmIlQFx_CwUNg7ocplQVbJ-Bg9XlY3z2WFZbdM19i1ufgtCz854sfd6dUMbmaa-DQEtBMNC6pSOtfm_SQFkIg8gHxTvlV-TjJf6HhvtcBfkZD8WAHQ1ifK2KZ4W-cPEqj_hy62rxBN_u0RrJt4AYaUEyPLI_0qt2ta3HfPBg4Ef2VoNEE1alIDoyl_Sxruk0RRNV3FUoeoaexc4dRwxEp3q-sTXhj4fA3g7qjoo5-K8mzwQAogjqmy0aDcbpyBy9B4nFU5GWT_A9-yVtZA",
        "expires_in": 315360000
      }
      ```


      ## POST accounts.boxc.com/auth/v1/revoke
      Removes a previously authorized user-client connection. The sub in the request body matches the sub in the JWT and is the same thing as the user ID.

      This endpoint uses Basic Authorization. The username is your Client ID and the password is your Client Secret.

      Example request:
      ```text
      POST /auth/v1/token HTTP/1.1
      Host: accounts.boxc.com
      Authorization: Basic Y2xpZW50X2lkOmNsaWVudF9zZWNyZXQ=
      Content-Type: application/x-www-form-urlencoded

      sub=198210
      ```

      Response:

      ```text
      HTTP/1.1 200 OK
      ```
  - name: CarrierCredentials
    x-displayName: Credentials
    description: |
      Some of the integrations support using your own account credentials with carriers while creating shipments and manifests. The parameters are different depending on the carrier. You can create a [Credential](/#tag/Credentials) and use it when creating shipments.
      | Name | <nobr>Carrier Code</nobr> | Parameters |
      |------|---------------------------|------------|
      | Australia Post | `AUSPost` | <details><summary>api_key</summary>String - API key assigned by AUSPost.</details><details><summary>api_password</summary>String - API password assigned by AUSPost.</details><details><summary>account_number</summary>String - Charge account number assigned by AUSPost.</details> |
      | Deutsche Post | <nobr>`DeutschePost`</nobr> | <details><summary>gkp_username</summary>String - GKP username value. This is the username you use to login to DHL API Developer Portal. Not required for testing.</details><details><summary>gkp_password</summary>String - GKP password value. This is the password you use to login to DHL API Developer Portal. Not required for testing.</details><details><summary>dp_api_key</summary>String - DeutschePost API Key that is created for you when you create an application via DHL API Developer Portal. Not required for testing.</details><details><summary>dp_api_secret</summary>String - DeutschePost API Secret that is created for you when you create an application via DHL API Developer Portal. Not required for testing.</details><details><summary>ekp</summary>String - EKP number that is assigned to you by DeutschePost. Not required for testing.</details><details><summary>contract_participation</summary>String - Contract participation value that is assigned to you by DeutschePost. Not required for testing.</details> |
      | DHL eCommerce | `DHLeC` | <details><summary>client_id</summary>String - Client ID that is assigned to you by DHL. Not required for testing.</details><details><summary>client_secret</summary>String - Client Secret value that is assigned to you by DHL. Not required for testing.</details> |
      | DHL Express | `DHL Express` | <details><summary>api_username</summary>String - API Username assigned to you by DHL. Not required for testing.</details><details><summary>api_password</summary>String - API Password that is assigned to you by DHL. Not required for testing.</details> |
      | Janio | `Janio` | <details><summary>api_key</summary>String - API key assigned to you by Janio. Not required for testing.</details> |
      | Poste Italiane | `PosteItaliane` | <details><summary>client_id</summary>String - Client ID assigned by Poste Italiane.</details><details><summary>client_secret_id</summary>String - Client Secret ID assigned by Poste Italiane.</details><details><summary>cost_center</summary>String - Cost Center assigned by Poste Italiane.</details> |
      | PostNL | `PostNL` | <details><summary>api_key</summary>String - API key assigned by PostNL.</details><details><summary>customer_code</summary>String - 4 character customer code assigned by PostNL.</details><details><summary>customer_number</summary>String - 8 digit customer number assigned by PostNL.</details> |
      | Saudi Post | `SPL` | <details><summary>username</summary>String - API username assigned by SPL.</details><details><summary>password</summary>String - API password assigned by SPL.</details> |
      | Sky Postal | `SkyPostal` | <details><summary>app_key</summary>String - API app_key assigned by SkyPostal.</details><details><summary>user_key</summary>String - API user_key assigned by SkyPostal.</details><details><summary>user_code</summary>String - API user_code assigned by SkyPostal.</details> |
  - name: CarrierParameters
    x-displayName: Parameters
    description: |
      Some carriers accept custom parameters for additional configuration. These dynamic fields provide a way to extend the integration by passing options directly to the carrier while creating shipments. Parameters may be added, removed, or changed in the future to accommodate upstream changes by the carriers and our own integrations.
      | Name | <nobr>Carrier Code</nobr> | Parameters |
      |------|---------------------------|------------|
      | Deutsche Post | <nobr>`DeutschePost`</nobr> | <details><summary>receiver_id</summary>String - Receiver ID is found in Post & DHL Business Customer Portal under the menu item "Returns" > "Settings" under the entry "Receiver ID". Required for return shipments. Not required for testing.</details><details><summary>label_format</summary>String - Printed label will be in the provided format. Accepted values:<ul><li>A4</li><li>910-300-300 (default)</li><li>910-300-300-oz</li><li>910-300-400</li><li>910-300-600</li><li>910-300-700</li><li>910-300-700-oz</li><li>910-300-710</li></ul></details> |
      | DHL eCommerce | `DHLeC` | <details><summary>pickup_id</summary>String - DHL eCommerce pickup account number. You will receive this after on-boarding with DHL eCommerce Solutions sales and customer implementation team. This is not the same as the Sold To Account number. Not required for testing.</details><details><summary>distribution_center</summary>String - Primary DHL eCommerce Distribution center assigned to your products/services. This is the distribution center where your packages are going to be lodged after pickup. Not required for testing.</details> |
      | DHL Express | <nobr>`DHL Express`</nobr> | <details><summary>shipping_account</summary> String - Shipper Account Number.</details><details><summary>ddp_account</summary> String - Duties and Taxes Account Number.</details><details><summary>documents</summary> Object<ul><li>label - Object <ul><li>template - ECOM26_84_A4_001, ECOM26_84_001 (default), ECOM_TC_A4, ECOM26_A6_002, ECOM26_84CI_001, ECOM26_84CI_002, ECOM26_84CI_003, ECOM_A4_RU_002, ECOM26_84_LBBX_001, ECOM26_64_LBBX_001</li></ul></li><li>invoice - Object<ul><li>template - COMMERCIAL_INVOICE_04, COMMERCIAL_INVOICE_P_10 (default), COMMERCIAL_INVOICE_L_10, RET_COM_INVOICE_A4_01</li></ul></li><li>waybill - Object<ul><li>template - ARCH_8X4_A4_002, ARCH_8X4 (default), ARCH_6X4, ARCH_A4_RU_002</li></ul></li></ul></details> |
      | Pos Malaysia | `PosMalaysia` | <details><summary>ppi_number</summary> String - PPI Number assigned by the carrier in the format of 'PMK9999'.</details> |
      | Poste Italiane | `PosteItaliane` | <details><summary>contract_code</summary>String - Contract Code assigned by Poste Italiane.</details><details><summary>customer_code</summary>String - Customer Code assigned by Poste Italiane.</details> |
      | Saudi Post | `SPL` | <details><summary>customer_code</summary>String - Customer code assigned by SPL.</details><details><summary>branch_code</summary>String - Primary branch code assigned to your account.</details> |
      | Sky Postal | `SkyPostal` | <details><summary>copa_id</summary>String - COPA ID assigned by SkyPostal.</details><details><summary>box_id</summary>String - Box ID assigned by SkyPostal which is based on the destination country.</details> |
