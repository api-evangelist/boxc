        '401':
          $ref: '#/definitions/Unauthorized'
        '403':
          $ref: '#/definitions/Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/definitions/NotFound'
              examples:
                notFound:
                  summary: Not Found
                  description: Shipment not found
                  value:
                    code: 1210
                    message: Shipment not found
                    errors:
                    - Shipment not found
        '429':
          $ref: '#/definitions/RateLimit'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/definitions/InternalServerError'
              examples:
                internalServerError:
                  summary: Internal Server Error
                  description: Shipment can't be deleted
                  value:
                    code: 1212
                    message: Shipment can't be deleted
                    errors:
                    - Shipment can't be deleted
  /shipments/{id}/process:
    put:
      tags:
      - Shipments
      summary: PUT /shipments/{id}/process
      description: Process a shipment with the final measured weight and dimensions. Useful for clients that process shipments at their own facilities. Only select clients are authorized to perform this action. This changes shipment status to <em>Processed</em> and can't be reversed.<p><strong>Note:</strong> Multi-package shipments can't be processed this way as of now.</p>
      operationId: processShipment
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - JWT:
        - write_shipments
        PrivilegedClient: []
      parameters:
      - name: id
        in: path
        description: The shipment ID
        required: true
        type: integer
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: "curl -X PUT https://api.boxc.com/v1/shipments/{id}/process \\\n  -H \"Authorization: Bearer <YOUR TOKEN>\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"shipment\": {\n      \"datetime\": \"2024-11-02 11:12:13\",\n      \"fulfillment_id\": null,\n      \"height\": 1.00,\n      \"length\": 15,\n      \"weight\": 0.088,\n      \"width\": 8,\n      \"irregular\": false\n    }\n  }'\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/definitions/ShipmentProcessRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipment:
                    properties:
                      status:
                        type: string
                        description: The updated shipment status.
                        example: Processed
                        enum:
                        - Processed
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/definitions/BadRequest'
              examples:
                validation:
                  summary: Validation error
                  description: The request schema is invalid.
                  value:
                    code: 1000
                    message: 'Validation Error. /shipment: The required properties (weight) are missing'
                    status: error
                    errors:
                    - '/shipment: The required properties (weight) are missing'
                badRequest:
                  summary: Bad Request
                  description: Shipment has no labels
                  value:
                    code: 1202
                    message: Shipment has no labels
                    errors:
                    - Shipment has no labels
                noRoutes:
                  summary: Bad Routes Request
                  description: No routes found
                  value:
                    code: 1050
                    message: No routes found
                    errors:
                    - No routes found
        '401':
          $ref: '#/definitions/Unauthorized'
        '403':
          $ref: '#/definitions/Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/definitions/NotFound'
              examples:
                notFound:
                  summary: Not Found
                  description: Shipment not found
                  value:
                    code: 1210
                    message: Shipment not found
                    errors:
                    - Shipment not found
        '429':
          $ref: '#/definitions/RateLimit'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/definitions/InternalServerError'
              examples:
                internalServerError:
                  summary: Internal Server Error
                  description: There was an error while charging the account balance
                  value:
                    code: 1082
                    message: There was an error while charging the account balance
                    errors:
                    - There was an error while charging the account balance
