              street1:
                type:
                - string
                - 'null'
                default: null
                description: Street address 1
                maxLength: 50
              street2:
                type:
                - string
                - 'null'
                default: null
                description: Street address 2
                maxLength: 50
              city:
                type:
                - string
                - 'null'
                default: null
                description: City
                maxLength: 40
              province:
                type:
                - string
                - 'null'
                default: null
                description: Province or state code
                maxLength: 40
              postal_code:
                type:
                - string
                - 'null'
                default: null
                description: Postal code
                maxLength: 10
              country:
                type:
                - string
                - 'null'
                pattern:
                - A-Z
                default: null
                description: Country code
                maxLength: 2
                minLength: 2
              email:
                type:
                - string
                - 'null'
                default: null
                description: E-mail address
                maxLength: 64
              phone:
                type:
                - string
                - 'null'
                default: null
                description: Phone number
                maxLength: 20
            required:
            - name
            - street1
            - city
            - country
            - email
            - phone
        required:
        - use_consignor
      type:
        type: string
        description: Product type. This value is immutable after creation.
        enum:
        - FOO
        - COS
        - FOO-CCW
        example: FOO
      uom:
        description: Unit of measurement for quantity.
        type:
        - string
        - 'null'
        enum:
        - 'null'
        - CG
        - CM3
        - DOZ
        - DPC
        - DPR
        - FOZ
        - G
        - GAL
        - KG
        - L
        - LB
        - M3
        - MCG
        - MG
        - ML
        - OZ
        - PCS
        - PRS
        - PTL
        - QTL
        - TOZ
        example: PCS
        default: null
      updated_at:
        type: string
        description: The date and time this product was last updated.
        example: '2025-08-29 14:10:14'
        readOnly: true
    required:
