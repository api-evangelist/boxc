- aid: boxc:boxc-shipments-api
  name: Boxc Shipments API
  description: >-
    The Shipments resource allows a user to create, update, retrieve, and delete shipments. Only test
    shipments and shipments without labels can be deleted. Shipments with uncancelled or processed labels
    cannot be updated. All shipments require address verification on the shipping address. Cancelling
    a label will refund the cost. Test shipments and shipments without labels are routinely purged from
    the system.


    There are some weight and volumetric constraints for shipments that is dependant on the route. For
    example, if a Shipment's length + girth is greater than a certain size then the user is charged an
    additional fee per KG. The length is the measurement of the longest dimension, and girth is the distance
    around the thickest part (perpendicular to the length). If the Shipment's weight or volume exceeds
    the limit for a route an error will be returned.


    **Note:** Set the `overpack_id` to null when unassigning it from an overpack. You won't be allowed
    to update a labelled shipment beyond that.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Shipments
  properties:
  - type: OpenAPI
    url: openapi/boxc-shipments-api-openapi.yml
