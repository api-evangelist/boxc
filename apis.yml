- aid: boxc:boxc-users-api
  name: Boxc Users API
  description: >-
    The Users resources allows an application to retrieve information about the tokenized user such as
    balances, personal/company address, and subscriptions. Only the addresses can be updated by applications


    ### Subscriptions


    A subscription is a recurring payment for a provided service. The specified `amount` is deducted from
    the user's BoxC balance at the start of each `interval` - also known as `current_period_start`.


    - Applications can only view subscriptions that belong to them.

    - Subscriptions automatically renew each interval until cancelled.

    - Cancelling a subscription will flag it to be deleted after `current_period_end`. To save a subscription
    it must be renewed before `current_period_end`.

    - Subscriptions are automatically removed from the list if their `current_period_end` is less than
    the current time.

    - A subscription cannot be modified after creation - only renewed.

    - A subscription will not be renewed if the user has insufficient funds.

    - A subscription can only be cancelled by the user from their account's dashboard.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - User
  tags_raw:
  - Users
  properties:
  - type: OpenAPI
    url: openapi/boxc-users-api-openapi.yml
  - type: Swagger
    url: openapi/_original/boxc-openapi-original.yml
