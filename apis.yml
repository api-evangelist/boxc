aid: boxc
name: Boxc
description: >-
  BoxC (BoxC Logistics, Inc.) is an international e-commerce logistics management platform.
  Its single RESTful API drives cross-border ecommerce by integrating dozens of carriers,
  customs clearance, duties and taxes, warehousing and fulfillment, and returns through one
  integration. A routing engine can complete every leg of a shipment's journey or only
  selected steps on the merchant's behalf. The v1 API (currently 1.123) exposes 83
  operations across 34 resources including Shipments, Labels, Orders, Products, Shops,
  Warehouses, Manifests, Overpacks, Inbound, Returns, Reshipments, Webhooks, Carrier
  Credentials, Customs Products, Entry Points, Tracking, Calculate Duty, Validate Address,
  and Classify. Authentication is OAuth 2.0 / OpenID Connect with RS256 JWT bearer tokens.
