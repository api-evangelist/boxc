- aid: boxc:boxc-orders-api
  name: Boxc Orders API
  description: >-
    The Orders resource allows you to create, read, update, and delete orders that are meant to be fulfilled
    by BoxC. If you wish to manually create an order for a third party shop you must provide the `shop.id`
    and `shop.order_id`. Neither property can be updated. The system will push tracking information to
    the shop when the order is fulfilled if both properties are set. Clients can force which warehouse
    is used for order fulfillment by setting the `warehouse.id` property.

    ### Order Status


    The following table lists all possible states of an order indicated by its `status` property. Updating
    an order that is 'Ready' will reset its status to 'Processing' and restore product quantities until
    it's processed by the system again.


    | Status | Description |

    |--------|-------------|

    | Backordered | There is insufficient quantity for one or more line items. The system will change
    the status once more inventory is added. |

    | Exception | There is a problem with the order such as missing or invalid information. The user must
    correct the problem before the order can be processed by the system. |

    | Holding | The order is being delayed from processing by the user. |

    | Processing | The order is waiting for the system to process it. Default state. |

    | Ready | The order is assigned to a warehouse for packing and quantities were deducted. |

    | Packing | One or more line items are being packed. <em>It can't be edited in this state</em>. |

    | Partial | The order was partially fulfilled. The remaining line items will be fulfilled when more
    inventory arrives. |

    | Fulfilled | The order was completely fulfilled. |

    | Archived | The system archives orders that were fulfilled at least 90 days in the past. |


    ### Pruning Orders


    The system routinely prunes or closes out orders in the system more than **365 days** ago. The start
    time is based on the `placed_at` and not the `created` datetime. What happens to the order depends
    on its current state at the time of pruning.


    - Unfulfilled (not Packing, Partial, Fulfilled) orders are deleted.

    - Partially fulfilled orders (Holding, Packing, Partial) are bumped to Fulfilled.

    - Orders in Packing have their unfulfilled line items and fulfillment objects deleted, and are bumped
    to Fulfilled.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Order
  tags_raw:
  - Orders
  properties:
  - type: OpenAPI
    url: openapi/boxc-orders-api-openapi.yml
  - type: Swagger
    url: openapi/_original/boxc-openapi-original.yml
  - type: Documentation
    url: https://docs.boxc.com/
  - type: APIReference
    url: https://docs.boxc.com/
- aid: boxc:boxc-overpacks-api
  name: Boxc Overpacks API
  description: >-
    The Overpacks resource allows a user to combine many Shipments into one object for faster clearance
    with BoxC and Customs. An overpack can be a carton, container, pallet, or bag. Regardless, it must
    contain an overpack label on the outside. Empty overpacks are routinely purged from the system.


    When creating an overpack it's recommended to provide one or more shipment ID, label ID, or tracking
    numbers in the request. The overpack will inherit the first shipment's (`n`) attributes like the `entry_point`,
    `service`, `terms`, etc. All shipments require identical attributes to be a part of the same overpack.
    Errors will be returned if the `n + 1` shipments do not match the first one. An error message will
    be present in the `shipments` array for each shipment that fails while creating or updating overpacks.
    Shipments that pass validation will still be added in the same request.


    The system will calculate the routing and other applicable carrier logic to determine the physical
    appearance of the label. Some carriers require custom messaging on the labels while others require
    a completely different label altogether. The system handles this logic on your behalf.


    **Note:** Shipments without labels and cancelled shipments can't be added to overpacks.


    The overpack(s) must be dropped off at the BoxC collection center indicated by the `entry_point`.
    Some entry points do not require overpacking and the system will prevent you from creating one. Deleting
    an overpack unassigns all shipments from it.


    **Note:** A client won't be able to print an overpack label until at least one shipment is assigned
    to it.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Overpacks
  properties:
  - type: OpenAPI
    url: openapi/boxc-overpacks-api-openapi.yml
  - type: Swagger
    url: openapi/_original/boxc-openapi-original.yml
