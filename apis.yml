- aid: boxc:boxc-reshipments-api
  name: Boxc Reshipments API
  description: >-
    The Reshipments resource allows you to reship one or more returned packages at a time from a BoxC
    warehouse. When a reshipment is created the `status` of all included returns will change to "Reshipping".
    Only returns with the following status can be reshipped: Processed, Verifying, and Verified. If reshipping
    more than one return at a time then you must wait for a facility operator to provide an `estimated_reship_fee`.
    If reshipping one return then the estimate will be instantaneous. In both cases you must approve the
    estimate before the reshipment is sent and your account is charged.


    **Note:** All returns in a bulk reshipment (> 1 return) must reside in the same warehouse.

    ### Status

    When a reshipment is created its status is set to "Pending" by default. It will remain that way until
    the `estimated_reship_fee` is populated by the system or facility operator. Afterwards, you have the
    option to approve or decline the amount by [updating](/#tag/Reshipments/operation/updateReshipment)
    the status accordingly. If "Declined", it will not be reshipped. If "Approved" it will be reshipped,
    tracking information will be made available, and a final reship_fee will be provided. Reshipments
    with the status "Approved" cannot be deleted.


    **Important:** Reshipments that are "Pending" or "Declined" longer than 15 days will be deleted by
    the system.


    **Note:** The final reshipping fee may differ from the estimated reshipping fee.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Reshipments
  properties:
  - type: OpenAPI
    url: openapi/boxc-reshipments-api-openapi.yml
  - type: Swagger
    url: openapi/_original/boxc-openapi-original.yml
  - type: Documentation
