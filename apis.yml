    url: https://docs.boxc.com/
- aid: boxc:boxc-returns-api
  name: Boxc Returns API
  description: >-
    The Returns resource allows a user to retrieve a list of returned shipments processed at a BoxC warehouse.
    Users may verify, [reship](/#tag/Reshipments), or discard their returns. Discarding a return is irreversible.

    ### Verify

    Users have the option to verify a return before reshipping it. The facility operator will take additional
    pictures of the contents inside the return and add messages if necessary. To verify a return the user
    should <strong>PUT</strong> a `status` of "Verify". This will change the status of the return to "Verifying"
    which cannot be reversed. Only returns in the "Processed" state can be verified.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Returns
  properties:
  - type: OpenAPI
    url: openapi/boxc-returns-api-openapi.yml
  - type: Swagger
    url: openapi/_original/boxc-openapi-original.yml
