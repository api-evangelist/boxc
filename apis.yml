    url: https://docs.boxc.com/
  - type: APIReference
    url: https://docs.boxc.com/
- aid: boxc:boxc-products-api
  name: Boxc Products API
  description: >-
    The Products resource allows users to add their products to the BoxC system. A product can have one
    or more Stock Keeping Units (SKUs). This gives users the ability to link their different shops' SKUs
    to the same product. There can only be one active SKU per shop per product. Orders won't be fulfilled
    until the warehouse accepts and processes your products. This includes measuring the weight and dimensions,
    and updating the quantity.


    **Note:** Products and SKUs linked to orders can't be deleted. Existing SKUs can't be assigned to
    a different shop.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
