- aid: boxc:boxc-credentials-api
  name: Boxc Credentials API
  description: >-
    The Credentials resource allows users to store their own carrier account secrets securely. This gives
    users the ability to reuse their credentials without providing actual secret values in every single
    shipment request. There can be multiple secret values stored in a single credential resource. Supported
    carriers and parameters can be found in the [Carrier Credentials](/#tag/CarrierCredentials) section.


    **Note:** All secret params that are stored by BoxC are encrypted at the storage layer using the Advanced
    Encryption Standard (AES) algorithm — AES-256.


    **Important:** Once a credential resource is created, it is not possible to see the secret values
    for security reasons.


    **Important:** If the secret values have to be updated for any reason, we recommend updating your
    existing Credential resource instead of creating a new one. Doing so will ensure that secret values
    are always up to date for previously created labels with the same Credential resource and event tracking
    is not affected adversely.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
