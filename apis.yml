- aid: boxc:boxc-inbound-api
  name: Boxc Inbound API
  description: >-
    The Inbound resource is part of the fulfillment component and allows customers to restock their products
    at warehouses operated by BoxC. An inbound shipment's products can't be modified after creation, but
    the warehouse, carrier, tracking number, and notes can be modified.


    ### Inbound Status

    The following table lists all possible states of an inbound shipment indicated by its `status` property.
    Only the system or warehouse can modify a shipment's status.


    | Status | Description |

    |--------|-------------|

    | Pending | The inbound shipment was created and may be en route to the warehouse. Default state.
    |

    | Received | The inbound shipment arrived at the warehouse. It can no longer be updated or deleted.
    |

    | Processed | The inbound shipment was processed and inventoried by the warehouse. |
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Inbound
