- aid: boxc:boxc-manifests-api
  name: Boxc Manifests API
  description: >-
    The Manifests resource is used for generating the paperwork required for dropping off Overpacks at
    a [collection center](/#tag/EntryPoints) or carrier facility at the end of the day. It also transmits
    the shipment data to the carrier(s) electronically. In order to create a manifest you must provide
    a list of the Overpacks that will be dropped off together. A manifest consists of all Shipments that
    are linked to each Overpack.


    **Note:** All overpacks in a manifest must have the same ```entry_point```, can't be empty, or missing
    weight and dimensions.


    Some manifests may have separate forms or no forms at all for the different carriers depending on
    the routes utilized by the affected shipments. Shipments should be sorted into Overpacks based on
    the carrier and other details prior to manifesting. Multiple copies of a form may exist for the driver
    and facility.


    **Note:** It can take up to several minutes before forms are available for download after manifesting
    because the required background tasks run asynchronously.


    **Important:** Once a manifest is created the associated overpacks and shipments can't be modified.
  humanURL: https://docs.boxc.com/
  baseURL: https://api.boxc.com/v1
  tags:
  - Manifests
