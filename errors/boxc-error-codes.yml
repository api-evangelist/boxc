method: searched
source: https://docs.boxc.com/#tag/Errors
format: boxc-error-envelope
envelope:
  description: Error responses carry a JSON object with four properties.
  fields:
  - status
  - code
  - message
  - errors
  example:
    status: error
    code: 1200
    message: Label could not be created
    errors:
      shipments/to/postal_code: Invalid value
notes: Numeric application error codes returned in the `code` field, independent of the HTTP status. Code
  1000 (Validation Error) may include a per-field `errors` map. Messages containing %s are interpolated
  at runtime. Error messages can be localized via the Accept-Language header. Rate-limit rejections surface
  as code 1015 (some docs also reference upstream code 1015 as "error code 1015"). Areas are derived from
  the documented code ranges.
