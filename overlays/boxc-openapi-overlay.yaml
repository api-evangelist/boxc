overlay: 1.0.0
info:
  title: API Evangelist enhancements for BoxC
  version: 1.0.0
extends: openapi/boxc-openapi-original.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-apievangelist-base-url: https://api.boxc.com/v1
    x-apievangelist-auth: oauth2-bearer-jwt
    x-apievangelist-oidc-discovery: https://accounts.boxc.com/.well-known/openid-configuration
    x-apievangelist-artifacts:
      authentication: authentication/boxc-authentication.yml
      scopes: scopes/boxc-scopes.yml
      conventions: conventions/boxc-conventions.yml
      errors: errors/boxc-error-codes.yml
      lifecycle: lifecycle/boxc-lifecycle.yml
      changelog: changelog/boxc-changelog.yml
      webhooks: asyncapi/boxc-webhooks.yml
      data_model: data-model/boxc-data-model.yml
- target: $.info
  update:
    x-apievangelist-webhook-topics:
    - shipments_status
    - shipments_label
    - orders_status
    - manifests_complete
    - fulfillments_complete
    - fulfillments_update
notes: >-
  API Evangelist enrichment overlay. Captures the production base URL, the OAuth 2.0 / OIDC
  authorization model (not fully expressed in the Swagger 2.0 securityDefinitions), and links
  to the derived enrichment artifacts. The original harvested spec is never mutated.
